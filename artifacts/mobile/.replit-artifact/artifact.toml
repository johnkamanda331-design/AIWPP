kind = "mobile"
previewPath = "/mobile/"
title = "AIPPMCS Mobile"
description = "Native mobile companion for field technicians and maintenance staff — monitor live pump telemetry, acknowledge faults, and send control commands from the field. Role-based access matches the web dashboard (administrator, technician, maintenance, viewer)."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
