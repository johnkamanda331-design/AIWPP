openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AIPPMCS - Adaptive Intelligent Water Pump Protection, Monitoring and Control System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: dashboard
    description: Dashboard summary
  - name: monitoring
    description: Live monitoring and telemetry
  - name: faults
    description: Fault detection and management
  - name: events
    description: Event timeline
  - name: schedules
    description: Scheduling
  - name: control
    description: Remote control
  - name: learning
    description: Adaptive learning
  - name: signature
    description: Electrical signature analysis
  - name: analytics
    description: Analytics and trends
  - name: energy
    description: Energy management
  - name: health-score
    description: Health scoring
  - name: notifications
    description: Notifications
  - name: settings
    description: Device and system settings
  - name: firmware
    description: OTA firmware management
  - name: users
    description: User management
  - name: reports
    description: Report generation

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard overview summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /monitoring/live:
    get:
      operationId: getLiveData
      tags: [monitoring]
      summary: Get current live telemetry snapshot
      responses:
        "200":
          description: Live telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTelemetry"

  /monitoring/history:
    get:
      operationId: getMonitoringHistory
      tags: [monitoring]
      summary: Get historical measurements
      parameters:
        - name: metric
          in: query
          schema:
            type: string
            enum: [voltage, current, frequency, realPower, reactivePower, apparentPower, powerFactor, energy, internalTemp]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: number
            default: 300
      responses:
        "200":
          description: Historical measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeasurementPoint"

  /faults:
    get:
      operationId: getFaults
      tags: [faults]
      summary: Get all faults
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: active
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Faults list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fault"

  /faults/{id}:
    get:
      operationId: getFault
      tags: [faults]
      summary: Get a specific fault
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Fault detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fault"

  /faults/summary:
    get:
      operationId: getFaultSummary
      tags: [faults]
      summary: Get fault counts by type and severity
      responses:
        "200":
          description: Fault summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaultSummary"

  /events:
    get:
      operationId: getEvents
      tags: [events]
      summary: Get event timeline
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, info]
        - name: type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
            default: 100
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsPage"

  /schedules:
    get:
      operationId: getSchedules
      tags: [schedules]
      summary: Get all schedules
      responses:
        "200":
          description: Schedules list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a new schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"

  /schedules/{id}:
    put:
      operationId: updateSchedule
      tags: [schedules]
      summary: Update a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /control/command:
    post:
      operationId: sendControlCommand
      tags: [control]
      summary: Send a control command to the pump controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlCommandInput"
      responses:
        "200":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learning:
    get:
      operationId: getLearningStatus
      tags: [learning]
      summary: Get adaptive learning status and model info
      responses:
        "200":
          description: Learning model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningStatus"

  /learning/action:
    post:
      operationId: performLearningAction
      tags: [learning]
      summary: Perform a learning model action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningActionInput"
      responses:
        "200":
          description: Action performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /signature:
    get:
      operationId: getElectricalSignature
      tags: [signature]
      summary: Get electrical signature analysis data
      responses:
        "200":
          description: Signature analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectricalSignature"

  /analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: Get analytics data for a given period
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly]
            default: weekly
        - name: metric
          in: query
          schema:
            type: string
            enum: [runtime, energy, power, voltage, current, powerFactor, faults, starts, healthScore, learningConfidence]
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"

  /analytics/insights:
    get:
      operationId: getAnalyticsInsights
      tags: [analytics]
      summary: Get auto-generated engineering insights
      responses:
        "200":
          description: Engineering insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsInsight"

  /energy:
    get:
      operationId: getEnergyData
      tags: [energy]
      summary: Get energy management data
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
      responses:
        "200":
          description: Energy data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnergyData"

  /health-score:
    get:
      operationId: getHealthScore
      tags: [health-score]
      summary: Get pump health score and component breakdown
      responses:
        "200":
          description: Health score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthScore"

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get notifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, info]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get device and system settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update system settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"

  /firmware:
    get:
      operationId: getFirmwareInfo
      tags: [firmware]
      summary: Get firmware information and available updates
      responses:
        "200":
          description: Firmware info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareInfo"

  /firmware/update:
    post:
      operationId: triggerFirmwareUpdate
      tags: [firmware]
      summary: Trigger a firmware OTA update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmwareUpdateInput"
      responses:
        "200":
          description: Update triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: Get all users
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /reports/generate:
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a downloadable report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        mfaToken:
          type: ["string", "null"]

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, username, email, role, isActive, createdAt]
      properties:
        id:
          type: number
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, technician, maintenance, viewer]
        isActive:
          type: boolean
        mfaEnabled:
          type: boolean
        lastLogin:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [username, email, password, role]
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [administrator, technician, maintenance, viewer]

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, technician, maintenance, viewer]
        isActive:
          type: boolean
        password:
          type: ["string", "null"]

    DashboardSummary:
      type: object
      required: [pumpState, powerAvailable, controllerOnline, internetStatus, wifiSignal, controllerTemp, firmwareVersion, lastSync, todayRuntime, todayEnergy, todayCost, nextScheduledStart, nextScheduledStop, pumpHealthScore, learningStatus, recentEvents, activeNotifications, systemStatus]
      properties:
        pumpState:
          type: string
          enum: [running, stopped, fault, starting, stopping, unknown]
        powerAvailable:
          type: boolean
        controllerOnline:
          type: boolean
        internetStatus:
          type: boolean
        wifiSignal:
          type: number
          description: dBm signal strength
        controllerTemp:
          type: number
          description: Celsius
        firmwareVersion:
          type: string
        lastSync:
          type: string
          format: date-time
        todayRuntime:
          type: number
          description: Hours
        todayEnergy:
          type: number
          description: kWh
        todayCost:
          type: number
          description: Currency units
        nextScheduledStart:
          type: ["string", "null"]
          format: date-time
        nextScheduledStop:
          type: ["string", "null"]
          format: date-time
        pumpHealthScore:
          type: number
          description: 0-100
        learningStatus:
          type: string
          enum: [learning, confident, frozen, insufficient_data]
        learningConfidence:
          type: number
          description: 0-100
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        activeNotifications:
          type: number
        systemStatus:
          type: string
          enum: [normal, warning, fault, offline]

    LiveTelemetry:
      type: object
      required: [timestamp, voltage, current, frequency, realPower, reactivePower, apparentPower, powerFactor, energy, runtime, motorState, supplyState, relayState, internalTemp, communicationQuality]
      properties:
        timestamp:
          type: string
          format: date-time
        voltage:
          type: number
          description: Volts
        current:
          type: number
          description: Amps
        frequency:
          type: number
          description: Hz
        realPower:
          type: number
          description: Watts
        reactivePower:
          type: number
          description: VAR
        apparentPower:
          type: number
          description: VA
        powerFactor:
          type: number
          description: 0-1
        energy:
          type: number
          description: kWh total
        runtime:
          type: number
          description: Hours today
        motorState:
          type: string
          enum: [running, stopped, starting, fault]
        supplyState:
          type: string
          enum: [normal, undervoltage, overvoltage, fault, absent]
        relayState:
          type: string
          enum: [closed, open]
        internalTemp:
          type: number
          description: Celsius
        communicationQuality:
          type: number
          description: 0-100
        historicalMin:
          type: object
          additionalProperties:
            type: number
        historicalMax:
          type: object
          additionalProperties:
            type: number
        rollingAvg:
          type: object
          additionalProperties:
            type: number

    MeasurementPoint:
      type: object
      required: [timestamp, value, metric]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
        metric:
          type: string

    Fault:
      type: object
      required: [id, type, severity, cause, recommendedAction, occurrences, confidence, trend, isActive, firstSeen, lastSeen]
      properties:
        id:
          type: number
        type:
          type: string
          enum: [dry_running, over_current, under_voltage, locked_rotor, power_failure, brownout, frequent_restart, long_runtime, communication_failure, controller_overtemperature]
        severity:
          type: string
          enum: [critical, high, medium, low]
        cause:
          type: string
        recommendedAction:
          type: string
        occurrences:
          type: number
        confidence:
          type: number
          description: 0-100
        trend:
          type: string
          enum: [increasing, stable, decreasing]
        isActive:
          type: boolean
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        description:
          type: ["string", "null"]

    FaultSummary:
      type: object
      required: [totalActive, totalHistorical, bySeverity, byType]
      properties:
        totalActive:
          type: number
        totalHistorical:
          type: number
        bySeverity:
          type: object
          additionalProperties:
            type: number
        byType:
          type: object
          additionalProperties:
            type: number

    Event:
      type: object
      required: [id, type, description, timestamp, severity]
      properties:
        id:
          type: number
        type:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
          enum: [critical, high, medium, info]
        details:
          type: ["string", "null"]

    EventsPage:
      type: object
      required: [events, total, offset, limit]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: number
        offset:
          type: number
        limit:
          type: number

    Schedule:
      type: object
      required: [id, name, type, startTime, endTime, isActive, priority, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        type:
          type: string
          enum: [daily, weekly, monthly, holiday, vacation, manual_override, temporary_override]
        startTime:
          type: string
          description: HH:MM
        endTime:
          type: string
          description: HH:MM
        days:
          type: array
          items:
            type: number
            description: 0=Sunday, 6=Saturday
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        isActive:
          type: boolean
        priority:
          type: number
        createdAt:
          type: string
          format: date-time

    ScheduleInput:
      type: object
      required: [name, type, startTime, endTime]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [daily, weekly, monthly, holiday, vacation, manual_override, temporary_override]
        startTime:
          type: string
        endTime:
          type: string
        days:
          type: array
          items:
            type: number
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        isActive:
          type: boolean
          default: true
        priority:
          type: number
          default: 1

    ScheduleUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [daily, weekly, monthly, holiday, vacation, manual_override, temporary_override]
        startTime:
          type: string
        endTime:
          type: string
        days:
          type: array
          items:
            type: number
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        isActive:
          type: boolean
        priority:
          type: number

    ControlCommandInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, restart, reset_fault, emergency_stop, enable_auto, enable_manual, disable_scheduling, lock_controls, unlock_controls]
        reason:
          type: ["string", "null"]
          description: Optional reason for logging

    CommandResponse:
      type: object
      required: [success, commandId, status]
      properties:
        success:
          type: boolean
        commandId:
          type: string
        status:
          type: string
          enum: [accepted, rejected, pending]
        message:
          type: ["string", "null"]

    LearningStatus:
      type: object
      required: [status, cycles, confidence, baselineCreated, currentModel, operatingProfile, lastUpdated]
      properties:
        status:
          type: string
          enum: [learning, confident, frozen, insufficient_data]
        cycles:
          type: number
          description: Number of pump cycles learned
        confidence:
          type: number
          description: 0-100
        baselineCreated:
          type: boolean
        currentModel:
          type: string
          description: Model version/description
        operatingProfile:
          $ref: "#/components/schemas/OperatingProfile"
        lastUpdated:
          type: string
          format: date-time
        progressPercent:
          type: number
          description: 0-100 learning progress

    OperatingProfile:
      type: object
      required: [nominalVoltage, nominalCurrent, nominalPower, startupDuration, shutdownDuration]
      properties:
        nominalVoltage:
          type: number
        nominalCurrent:
          type: number
        nominalPower:
          type: number
        startupDuration:
          type: number
          description: Seconds
        shutdownDuration:
          type: number
          description: Seconds
        avgRuntime:
          type: number
          description: Hours per cycle
        startupCurrentPeak:
          type: number

    LearningActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [restart, freeze, unfreeze, export, import]

    ElectricalSignature:
      type: object
      required: [normalRunningRegion, currentReading, deviation, confidenceLevel, similarityScore, startupProfile, shutdownProfile, trendComparison]
      properties:
        normalRunningRegion:
          type: object
          required: [minCurrent, maxCurrent, minPower, maxPower, minVoltage, maxVoltage]
          properties:
            minCurrent: { type: number }
            maxCurrent: { type: number }
            minPower: { type: number }
            maxPower: { type: number }
            minVoltage: { type: number }
            maxVoltage: { type: number }
        currentReading:
          type: object
          required: [current, power, voltage, powerFactor]
          properties:
            current: { type: number }
            power: { type: number }
            voltage: { type: number }
            powerFactor: { type: number }
        deviation:
          type: number
          description: Percentage deviation from baseline
        confidenceLevel:
          type: number
          description: 0-100
        similarityScore:
          type: number
          description: 0-100
        startupProfile:
          type: array
          items:
            $ref: "#/components/schemas/SignaturePoint"
        shutdownProfile:
          type: array
          items:
            $ref: "#/components/schemas/SignaturePoint"
        trendComparison:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"

    SignaturePoint:
      type: object
      required: [timeOffset, current, power]
      properties:
        timeOffset:
          type: number
          description: Seconds from start/stop
        current:
          type: number
        power:
          type: number

    TrendPoint:
      type: object
      required: [timestamp, historical, current]
      properties:
        timestamp:
          type: string
          format: date-time
        historical:
          type: number
        current:
          type: number

    AnalyticsData:
      type: object
      required: [period, labels, datasets]
      properties:
        period:
          type: string
          enum: [daily, weekly, monthly, yearly]
        labels:
          type: array
          items:
            type: string
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDataset"

    AnalyticsDataset:
      type: object
      required: [metric, label, data, unit]
      properties:
        metric:
          type: string
        label:
          type: string
        data:
          type: array
          items:
            type: number
        unit:
          type: string

    AnalyticsInsight:
      type: object
      required: [id, category, insight, severity, timestamp]
      properties:
        id:
          type: number
        category:
          type: string
          enum: [runtime, energy, voltage, current, faults, health, efficiency]
        insight:
          type: string
        severity:
          type: string
          enum: [positive, neutral, warning, critical]
        changePercent:
          type: ["number", "null"]
        timestamp:
          type: string
          format: date-time

    EnergyData:
      type: object
      required: [period, totalConsumption, estimatedCost, projectedMonthly, peakUsage, idleConsumption, dailyBreakdown, suggestions]
      properties:
        period:
          type: string
        totalConsumption:
          type: number
          description: kWh
        estimatedCost:
          type: number
        projectedMonthly:
          type: number
        peakUsage:
          type: number
          description: kW peak demand
        idleConsumption:
          type: number
          description: kWh idle
        dailyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/EnergyDayPoint"
        suggestions:
          type: array
          items:
            type: string

    EnergyDayPoint:
      type: object
      required: [date, consumption, cost, runtime]
      properties:
        date:
          type: string
          format: date
        consumption:
          type: number
        cost:
          type: number
        runtime:
          type: number

    HealthScore:
      type: object
      required: [overall, bearingCondition, electricalCondition, voltageQuality, motorLoading, runtimeBehavior, protectionStatus, predictedMaintenance, confidence, trend, lastUpdated]
      properties:
        overall:
          type: number
          description: 0-100
        bearingCondition:
          type: number
          description: 0-100
        electricalCondition:
          type: number
          description: 0-100
        voltageQuality:
          type: number
          description: 0-100
        motorLoading:
          type: number
          description: 0-100
        runtimeBehavior:
          type: number
          description: 0-100
        protectionStatus:
          type: number
          description: 0-100
        predictedMaintenance:
          type: string
          description: ISO date of next predicted maintenance
        confidence:
          type: number
          description: 0-100
        trend:
          type: string
          enum: [improving, stable, declining]
        remainingUsefulLifeDays:
          type: ["number", "null"]
        lastUpdated:
          type: string
          format: date-time
        recommendations:
          type: array
          items:
            type: string

    Notification:
      type: object
      required: [id, type, severity, message, timestamp, isRead]
      properties:
        id:
          type: number
        type:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, info]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        isRead:
          type: boolean
        details:
          type: ["string", "null"]

    SystemSettings:
      type: object
      required: [controllerName, timezone, wifi, mqtt, protection, relay, learning]
      properties:
        controllerName:
          type: string
        timezone:
          type: string
        wifi:
          type: object
          properties:
            ssid:
              type: string
            signalStrength:
              type: number
        mqtt:
          type: object
          properties:
            broker:
              type: string
            port:
              type: number
            enabled:
              type: boolean
        protection:
          type: object
          properties:
            overCurrentThreshold:
              type: number
            underVoltageThreshold:
              type: number
            overTempThreshold:
              type: number
            dryRunTimeout:
              type: number
            maxRuntime:
              type: number
        relay:
          type: object
          properties:
            startDelay:
              type: number
            stopDelay:
              type: number
        learning:
          type: object
          properties:
            enabled:
              type: boolean
            sensitivity:
              type: string
              enum: [low, medium, high]
            minCyclesForBaseline:
              type: number
        currencySymbol:
          type: string
        electricityRate:
          type: number

    SettingsUpdate:
      type: object
      properties:
        controllerName:
          type: string
        timezone:
          type: string
        mqtt:
          type: object
          properties:
            broker:
              type: string
            port:
              type: number
            enabled:
              type: boolean
        protection:
          type: object
          properties:
            overCurrentThreshold:
              type: number
            underVoltageThreshold:
              type: number
            overTempThreshold:
              type: number
            dryRunTimeout:
              type: number
            maxRuntime:
              type: number
        relay:
          type: object
          properties:
            startDelay:
              type: number
            stopDelay:
              type: number
        learning:
          type: object
          properties:
            enabled:
              type: boolean
            sensitivity:
              type: string
              enum: [low, medium, high]
        currencySymbol:
          type: string
        electricityRate:
          type: number

    FirmwareInfo:
      type: object
      required: [currentVersion, currentDate, availableUpdate, releaseNotes, canRollback, updateInProgress]
      properties:
        currentVersion:
          type: string
        currentDate:
          type: string
          format: date
        availableUpdate:
          type: ["string", "null"]
        availableUpdateDate:
          type: ["string", "null"]
          format: date
        releaseNotes:
          type: ["string", "null"]
        canRollback:
          type: boolean
        rollbackVersion:
          type: ["string", "null"]
        updateInProgress:
          type: boolean
        updateProgress:
          type: ["number", "null"]
          description: 0-100

    FirmwareUpdateInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [update, rollback, enter_recovery]
        targetVersion:
          type: ["string", "null"]

    ReportInput:
      type: object
      required: [type, from, to]
      properties:
        type:
          type: string
          enum: [energy, faults, runtime, voltage_quality, maintenance, learning, comprehensive]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        format:
          type: string
          enum: [pdf, csv, excel, json]
          default: pdf
        includeCharts:
          type: boolean
          default: true

    ReportResult:
      type: object
      required: [reportId, status, downloadUrl]
      properties:
        reportId:
          type: string
        status:
          type: string
          enum: [generating, ready, error]
        downloadUrl:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
